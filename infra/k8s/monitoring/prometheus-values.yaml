# Lightweight prometheus config for GKE Autopilot

grafana:
  enabled: true
  adminPassword: prom-operator
  
prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    
    # Service monitors
    serviceMonitorSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    
    additionalScrapeConfigs:
    - job_name: 'app-metrics'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - dev
          - prod
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__

alertmanager:
  enabled: false

kubeStateMetrics:
  enabled: true

# Disable node exporter - not compatible with GKE Autopilot
nodeExporter:
  enabled: false

# Disable kube-system monitoring for Autopilot
defaultRules:
  create: true
  rules:
    kubeScheduler: false

kubeScheduler:
  enabled: false

kubeControllerManager:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

kubelet:
  enabled: false

coreDns:
  enabled: false

kubeApiServer:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # Prevent admission webhook issues
  admissionWebhooks:
    enabled: false

